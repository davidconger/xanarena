name: Deploy to Azure App Service

on:
  workflow_dispatch: # manual only: Actions tab > Deploy to Azure App Service > Run workflow

permissions:
  id-token: write # OIDC sign-in to Azure, no publish profile or basic auth
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git*' \
            --exclude '_site' \
            --exclude '*.md'

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: xanarena
          package: _site
