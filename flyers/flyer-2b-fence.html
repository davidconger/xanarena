<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xanarena flyer 2B: The fence</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="flyer.css">
  <style>
    @page { size: letter landscape; margin: 0; }
    .scene { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <main class="sheet sheet--landscape">
    <!-- 1 viewBox unit = 0.01in of the 10.2 x 7.7in printable area -->
    <svg class="scene" viewBox="0 0 1020 770" role="img" aria-label="Two crows on a chain-link fence under the moon. A sign wired to the fence reads Scan if you dare, with a QR code.">
      <defs>
        <pattern id="chain" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M0 15L15 0L30 15L15 30Z" fill="none" stroke="#111" stroke-width="1.3"/>
        </pattern>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff"/>
          <stop offset=".7" stop-color="#fff" stop-opacity=".55"/>
          <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
        </linearGradient>
        <mask id="fence-mask"><rect x="0" y="0" width="1020" height="770" fill="url(#fade)"/></mask>
        <symbol id="crow" viewBox="0 0 120 90">
          <path d="M4 31l17-5c3-9 13-13 22-9 6 3 9 8 13 13 14 7 33 14 48 27 3 3 5 6 9 10-11-3-25-7-37-7-3 7-9 12-19 13l2 13h5l-1 2H52l2-15c-2 0-4 1-6 0l1 15h4l-1 2h-9l1-17c-11-4-17-13-19-24-2-6-5-9-11-10z"/>
        </symbol>
      </defs>

      <!-- moon -->
      <circle cx="862" cy="118" r="86" fill="#fff" stroke="#111" stroke-width="3"/>
      <path d="M816 62a86 86 0 0 0 0 112" fill="none" stroke="#5ee04a" stroke-width="6" stroke-linecap="round"/>

      <!-- fence -->
      <rect x="40" y="262" width="940" height="480" fill="url(#chain)" mask="url(#fence-mask)"/>
      <path d="M26 262H994" stroke="#111" stroke-width="9" stroke-linecap="round"/>
      <path d="M40 246V744M300 252V744M720 252V744M980 246V744" stroke="#111" stroke-width="12" stroke-linecap="round"/>
      <path d="M0 746H1020" stroke="#111" stroke-width="3"/>

      <!-- crows on the rail -->
      <use href="#crow" x="118" y="124" width="180" height="135" fill="#111"/>
      <circle cx="147" cy="159.5" r="5.5" fill="#5ee04a"/>
      <g transform="translate(1440 0) scale(-1 1)">
        <use href="#crow" x="640" y="146" width="150" height="112" fill="#111"/>
        <circle cx="664" cy="175.6" r="4.8" fill="#5ee04a"/>
      </g>

      <!-- sign wired to the fence -->
      <g transform="rotate(-3 510 505)">
        <path d="M420 262L432 316M600 262L588 316" stroke="#111" stroke-width="3"/>
        <rect x="370" y="306" width="280" height="392" rx="8" fill="#fff" stroke="#111" stroke-width="5"/>
        <rect x="381" y="317" width="258" height="370" rx="4" fill="none" stroke="#5ee04a" stroke-width="2.5"/>
        <circle cx="432" cy="320" r="5" fill="#111"/><circle cx="588" cy="320" r="5" fill="#111"/>
        <text x="510" y="372" text-anchor="middle" font-family="Creepster, Impact, fantasy" font-size="33" letter-spacing="1" fill="#111">Scan if you dare</text>
        <svg x="395" y="392" width="230" height="230" data-qr data-quiet="1"></svg>
        <text x="510" y="660" text-anchor="middle" font-family="Oswald, sans-serif" font-size="17" letter-spacing="1" fill="#111" data-url></text>
      </g>
    </svg>
  </main>

  <script src="vendor/qrcode.js"></script>
  <script src="flyer-config.js"></script>
  <script src="flyer.js"></script>
</body>
</html>
